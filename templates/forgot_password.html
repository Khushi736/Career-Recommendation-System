<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
    /* Exact same CSS from your Login Page */
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1c92d2);
        background-size: 400% 400%;
        animation: gradientBG 10s ease infinite;
    }

    @keyframes gradientBG {
        0% {background-position: 0% 50%;}
        50% {background-position: 100% 50%;}
        100% {background-position: 0% 50%;}
    }

    .login-box {
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(15px);
        padding: 40px;
        border-radius: 20px;
        width: 360px; 
        text-align: center;
        box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    .login-box h2 {
        margin-bottom: 10px;
        color: #fff;
    }

    .login-box input {
        width: 100%;
        padding: 12px 15px;
        margin: 15px 0;
        border: none;
        border-radius: 8px;
        outline: none;
        font-family: 'Poppins', sans-serif;
    }

    .login-box button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg,#00c6ff,#0072ff);
        color: white;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.3s;
    }

    .login-box button:hover {
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(0, 198, 255, 0.4);
    }

    .login-box p {
        color: #ccc;
        margin-top: 20px;
        font-size: 14px;
    }

    .login-box p a {
        color: #00c6ff;
        text-decoration: none;
    }
    
    .login-box p a:hover {
        text-decoration: underline;
    }

    /* specific instruction text style */
    .instruction-text {
        font-size: 13px;
        color: #ccc;
        margin-bottom: 20px;
        line-height: 1.5;
    }
</style>
</head>
<body>

<form class="login-box" method="POST">
    <h2>Reset Password</h2>
    
    <p class="instruction-text">
        Enter your registered email address and we will send you a link to reset your password.
    </p>

    <input type="email" name="email" placeholder="Enter your @gmail.com address" 
           pattern="^[a-zA-Z0-9._%+\-]+@gmail\.com$" 
           title="You must use a valid @gmail.com address" 
           required>

    <button type="submit">Send Reset Link</button>
    
    <p><a href="/admin/login"><i class="fa-solid fa-arrow-left"></i> Back to Login</a></p>
</form>

</body>
</html>
