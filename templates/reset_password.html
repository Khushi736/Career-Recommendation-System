<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password | Career AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #1c92d2, #f2fcfe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 400px;
            text-align: center;
        }

        h2 { color: #333; margin-bottom: 30px; font-weight: 600; }

        .password-container {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            transition: 0.3s;
            font-size: 14px;
        }

        /* Real-time Validation UI */
        input:focus { border-color: #1c92d2; }
        input:not(:placeholder-shown):invalid { border-color: #ff4d4d; }
        input:not(:placeholder-shown):valid { border-color: #00E676; }

        .password-container i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1c92d2;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(28, 146, 210, 0.3);
        }

        button:hover {
            background: #167fb8;
            transform: translateY(-2px);
        }

        .requirements {
            font-size: 11px;
            color: #666;
            text-align: left;
            margin-top: -10px;
            margin-bottom: 20px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Secure Reset</h2>
    <form id="resetForm">
        <div class="password-container">
            <input type="password" name="password" id="password" placeholder="New Password" 
                   pattern="(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':&quot;\\|,.<>\/?~]).{8,}" required>
            <i class="fa-solid fa-eye" id="togglePassword"></i>
        </div>
        <div class="requirements">
            Min. 8 chars, 1 number, & 1 special character.
        </div>

        <div class="password-container">
            <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm New Password" required>
            <i class="fa-solid fa-eye" id="toggleConfirm"></i>
        </div>

        <button type="submit">Update Password</button>
    </form>
</div>

<script>
    // Eye Icon Toggles
    [ ['#togglePassword', '#password'], ['#toggleConfirm', '#confirm_password'] ].forEach(([btn, field]) => {
        document.querySelector(btn).addEventListener('click', function() {
            const input = document.querySelector(field);
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });
    });

    // Form Submission with Popup
    document.getElementById('resetForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const pass = document.getElementById('password').value;
        const confirm = document.getElementById('confirm_password').value;

        if(pass !== confirm) {
            Swal.fire('Error', 'Passwords do not match!', 'error');
            return;
        }

        // Send data to Flask via AJAX
        fetch(window.location.href, {
            method: 'POST',
            body: new FormData(this)
        }).then(response => {
            if (response.ok) {
                Swal.fire({
                    title: 'Success!',
                    text: 'Your password has been updated.',
                    icon: 'success',
                    confirmButtonText: 'Login Now',
                    confirmButtonColor: '#1c92d2'
                }).then(() => {
                    window.location.href = "/admin/login";
                });
            } else {
                Swal.fire('Error', 'Token expired or invalid.', 'error');
            }
        });
    });
</script>

</body>
</html>
